<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的AI聊天</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui; background:#f5f5f5;
         display:flex; flex-direction:column; height:100vh; }
  #list { flex:1; overflow-y:auto; padding:16px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:12px; margin:8px 0;
         white-space:pre-wrap; line-height:1.6; word-break:break-word; }
  .user { background:#007aff; color:#fff; margin-left:auto; }
  .ai { background:#fff; }
  .err { background:#ffe5e5; color:#c00; font-size:13px; }
  #bar { display:flex; gap:8px; padding:12px; background:#fff; border-top:1px solid #ddd; }
  #input { flex:1; padding:10px; border:1px solid #ccc; border-radius:8px;
           font-size:15px; height:44px; font-family:inherit; }
  button { padding:0 20px; border:0; border-radius:8px; background:#007aff;
           color:#fff; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
  <div id="list"></div>
  <div id="bar">
    <textarea id="input" placeholder="说点什么…"></textarea>
    <button id="send">发送</button>
  </div>
<script>
const API_URL = 'https://api.jumengai.net/v1/chat/completions';
const API_KEY = 'sk-ZAN0WbAQv5aEYiRKeWdPvmMNCi7wuvnmqjwLulJi3UrDrI2y';
const MODEL = '[满血Ais]gemini-3.1-pro-preview';

const list = document.getElementById('list');
const input = document.getElementById('input');
let history = [{ role:'system', content:'你是一个乐于助人的助手。' }];

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  list.appendChild(d); list.scrollTop = list.scrollHeight; return d;
}

document.getElementById('send').onclick = async () => {
  const text = input.value.trim(); if (!text) return;
  input.value = '';
  add(text, 'user');
  history.push({ role:'user', content:text });
  const ai = add('正在发送…', 'ai');

  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + API_KEY },
      body: JSON.stringify({ model:MODEL, messages:history, stream:true })
    });

    if (!res.ok) {
      const t = await res.text();
      ai.className = 'msg err';
      ai.textContent = 'HTTP ' + res.status + '：' + t;
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', ans = '';
    ai.textContent = '';
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim();
        if (d === '[DONE]') continue;
        try {
          ans += JSON.parse(d).choices[0].delta.content || '';
          ai.textContent = ans; list.scrollTop = list.scrollHeight;
        } catch(e){}
      }
    }
    history.push({ role:'assistant', content:ans });
  } catch (err) {
    ai.className = 'msg err';
    ai.textContent = '请求失败：' + err.message;
  }
};

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
    document.getElementById('send').click(); }
});
</script>
</body>
</html>
